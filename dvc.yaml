# updated dvc.yaml

stages:
  data_ingestion:
    cmd: python mlops_mini_pro/src/data/data_ingestion.py
    deps:
    - mlops_mini_pro/src/data/data_ingestion.py
    params:
    - data_ingestion.test_size
    outs:
    - data/raw

  data_preprocessing:
    cmd: python mlops_mini_pro/src/data/data_preprocessing.py
    deps:
    - data/raw
    - mlops_mini_pro/src/data/data_preprocessing.py
    outs:
    - data/interim

  feature_engineering:
    cmd: python mlops_mini_pro/src/features/feature_engineering.py
    deps:
    - data/interim
    - mlops_mini_pro/src/features/feature_engineering.py
    params:
    - feature_engineering.max_features
    outs:
    - data/processed
    - mlops_mini_pro/models/vectorizer.pkl

  model_building:
    cmd: python mlops_mini_pro/src/model/model_building.py
    deps:
    - data/processed
    - mlops_mini_pro/src/model/model_building.py
    outs:
    - mlops_mini_pro/models/model.pkl

  model_evaluation:
    cmd: python "C:\\Users\\saeed\\Desktop\\MLOps\\mlops_mini_project\\mlops_mini_pro\\src\\model\\model_evaluation.py"
    deps:
    - mlops_mini_pro/models/model.pkl
    - mlops_mini_pro/src/model/model_evaluation.py
    metrics:
    - mlops_mini_pro/reports/metrics.json
    outs:
    - mlops_mini_pro/reports/experiment_info.json  # Add the model_info.json file as an output
